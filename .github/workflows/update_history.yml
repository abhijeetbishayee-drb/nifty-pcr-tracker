name: Update PCR history

on:
  # Re-saved 2026-09-28 alongside update.yml's scheduler nudge -- same fix.
  schedule:
    # Once daily after NSE bhavcopy is typically published (~18:30 IST = 13:00 UTC)
    - cron: '0 13 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-pcr-history
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install certifi

      - name: Append today's PCR to history
        run: python scripts/backfill_history.py 3

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pcr_history.csv
          git diff --staged --quiet || git commit -m "Update PCR history"
          git push
